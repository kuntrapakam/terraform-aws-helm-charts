apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: microservices-appset
  namespace: argocd
spec:
  generators:
    # 1. Look inside your Git repository
    - git:
        repoURL: 'https://github.com'
        # FIXED: Changed targetRevision to revision
        revision: HEAD
        # 2. Find any sub-folder inside the 'test/' directory
        directories:
          - path: test/*
  template:
    metadata:
      # 3. Dynamically name the app based on the sub-folder name
      name: '{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: 'https://github.com'
        targetRevision: HEAD # This one remains targetRevision (standard Application spec)
        # 4. Use the discovered sub-folder path as the source configuration
        path: '{{path}}'
      destination:
        server: 'https://kubernetes.default.svc'
        # 5. Automatically deploy into a namespace matching the app name
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
